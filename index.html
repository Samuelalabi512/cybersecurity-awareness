<!DOCTYPE html>
<html>
<head>
    <title>Cybersecurity Awareness</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #174ea6;
        }

        button {
            background: #174ea6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cybersecurity Awareness</h1>
        <h3>Learn to Recognise Phishing Attacks</h3>

        <p>
            Phishing is an online attack where criminals
            impersonate trusted organisations to trick people.
        </p>

        <p>Always check suspicious links before clicking.</p>

        <button onclick="alert('Training successful! Always verify links before clicking.')">
            Start Training
        </button>
    </div>
</body>
</html>
